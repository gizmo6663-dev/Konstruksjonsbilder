# Publiserer appen til GitHub Pages.
#
# Appen er ren statisk HTML/CSS/JS uten byggesteg, så vi laster opp
# repoet som det er. Kjører bare for standardbranchen, uansett hva den heter.

name: Publiser til GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# La en pågående publisering bli ferdig i stedet for å avbryte den.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publiser:
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Sett opp Pages
        uses: actions/configure-pages@v5
        with:
          # Slår på Pages for repoet første gang, så det ikke må gjøres manuelt.
          enablement: true

      - name: Pakk nettstedet
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publiser
        id: deploy
        uses: actions/deploy-pages@v4
